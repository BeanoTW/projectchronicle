name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pre-existing baseline: lovable-tagger 1.1.13 declares Vite <8 while
      # Chronicle already runs Vite 8. Preserve that install state in CI so
      # verification reaches the tests/build instead of changing dependencies.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
