<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1115" />
  <title>Updating Chronicle</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #f5f0e6; }
    main { width: min(88vw, 26rem); padding: 2rem; border: 1px solid #2c343d; border-radius: 1rem; background: #151a20; text-align: center; }
    h1 { margin: 0 0 .75rem; font-family: Georgia, serif; font-size: 1.65rem; }
    p { margin: 0; color: #adb4bd; line-height: 1.55; }
    .mark { width: 2.75rem; height: 2.75rem; margin: 0 auto 1rem; border: 2px solid #63c9ab; border-radius: .5rem; display: grid; place-items: center; font-size: 1.4rem; }
    .error { color: #f2c5bd; margin-top: 1rem; }
    button { margin-top: 1rem; border: 0; border-radius: .65rem; padding: .75rem 1rem; background: #63c9ab; color: #0f1115; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">↻</div>
    <h1>Updating Chronicle</h1>
    <p id="status">Removing the old app shell. Your records and account data will not be cleared.</p>
    <button id="retry" type="button" hidden>Try again</button>
  </main>
  <script>
    const status = document.getElementById('status');
    const retry = document.getElementById('retry');

    async function refreshChronicle() {
      retry.hidden = true;
      status.className = '';
      status.textContent = 'Removing the old app shell. Your records and account data will not be cleared.';
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(
            keys
              .filter(key => /chronicle|workbox-precache/i.test(key))
              .map(key => caches.delete(key))
          );
        }

        status.textContent = 'Update ready. Reopening Chronicle…';
        setTimeout(() => {
          window.location.replace('/?chronicle-update=1.5.7-' + Date.now());
        }, 800);
      } catch {
        status.textContent = 'The update could not be completed. Your records are unchanged.';
        status.className = 'error';
        retry.hidden = false;
      }
    }

    retry.addEventListener('click', refreshChronicle);
    refreshChronicle();
  </script>
</body>
</html>
